# Configuração nginx para a VM de reverse proxy
# Domínio: agentes.casadosparafusosvta.com
#
# Pré-requisitos na VM de proxy:
#   1. nginx instalado
#   2. certbot instalado:  sudo apt install certbot python3-certbot-nginx
#   3. DNS: registro A de agentes.casadosparafusosvta.com → IP desta VM de proxy
#   4. Porta 80 e 443 abertas no firewall
#
# Passos para ativar:
#   sudo cp nginx-proxy-vm.conf /etc/nginx/sites-available/agentes.casadosparafusosvta.com
#   sudo certbot certonly --nginx -d agentes.casadosparafusosvta.com
#   sudo ln -s /etc/nginx/sites-available/agentes.casadosparafusosvta.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Substitua <IP_DA_VM_BOTCDP> pelo IP da VM onde rodam os containers Docker.

upstream botcdp_frontend {
    server <IP_DA_VM_BOTCDP>:9001;
    keepalive 32;
}

server {
    listen 80;
    server_name agentes.casadosparafusosvta.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentes.casadosparafusosvta.com;

    ssl_certificate     /etc/letsencrypt/live/agentes.casadosparafusosvta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentes.casadosparafusosvta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15M;

    # Cabeçalhos de segurança — só fazem sentido aqui, que é onde o TLS
    # é terminado (o nginx interno do container só fala HTTP simples).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        proxy_pass         http://botcdp_frontend;
        proxy_http_version 1.1;

        # WebSocket — necessário para Socket.IO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Manter conexões WebSocket abertas (Socket.IO de longa duração)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
