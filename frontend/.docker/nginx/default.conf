server {
  listen 80;
  server_name localhost;
  index index.html;

  root /usr/share/nginx/html;

  # HSTS fica no proxy de borda (TLS termina lá); aqui ficam os headers
  # que não dependem de HTTPS.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # microphone=(self) libera a gravação de áudio do painel (AudioRecorder,
  # via getUserMedia) — câmera/geolocalização continuam bloqueadas, não são
  # usadas (a captura de foto usa o app de câmera nativo via <input capture>,
  # que não depende dessa política).
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Envio de mídia (fotos/áudios/vídeos do chat) precisa de um limite
    # generoso — sem isso, cai no padrão do nginx (1MB) e vídeos maiores
    # tomam 413 antes de chegar no backend. Mantido igual ao limite do
    # multer (config/upload.ts) e do proxy externo (VM devproxy).
    client_max_body_size 200m;
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /socket.io/ {
    proxy_pass http://backend:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
