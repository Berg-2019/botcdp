networks:
  botcdp:

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    restart: always
    environment:
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - DB_HOST=mysql
      - DB_USER=${MYSQL_APP_USER:-botcdp_app}
      - DB_PASS=${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      - DB_NAME=${MYSQL_DATABASE:-botcdp}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - JWT_RESET_SECRET=${JWT_RESET_SECRET:?JWT_RESET_SECRET is required}
      - BACKEND_URL=${BACKEND_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9001}
      - PROXY_PORT=${PROXY_PORT:-9000}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-whaileys}
      - WHATSAPP_INVITE_MIN_CONNECTION_AGE_DAYS=${WHATSAPP_INVITE_MIN_CONNECTION_AGE_DAYS:-7}
      - IO_REDIS_SERVER=redis
      - IO_REDIS_PORT=6379
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${BACKEND_PORT:-9000}:3000
    volumes:
      - public_data:/usr/src/app/public/
      - wwebjs_auth:/usr/src/app/.wwebjs_auth/

    networks:
      - botcdp

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL:-http://localhost:9000}
    ports:
      - ${FRONTEND_PORT:-9001}:80
    environment:
      - URL_BACKEND=backend:3000
      - REACT_APP_BACKEND_URL=${BACKEND_URL:-http://localhost}:${BACKEND_PORT:-9000}/
    depends_on:
      - backend
    restart: always
    networks:
      - botcdp

  mysql:
    image: mariadb:10.6
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-botcdp}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_USER=${MYSQL_APP_USER:-botcdp_app}
      - MYSQL_PASSWORD=${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      - TZ=${TZ:-America/Sao_Paulo}
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - botcdp

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - botcdp

# Volumes com "name" explícito e fixo.
#
# Em deploy manual (`docker compose up`), isso prende os volumes aos nomes
# botcdp_*, sem depender do nome do diretório do projeto.
#
# ATENÇÃO: o Coolify ignora este "name". No deploy pelo Coolify os volumes
# passam a se chamar "<uuid-da-aplicação>_<nome-com-hífen>" — por exemplo
# "vs9yqaujlzryrgxcdjrr2nty_mysql-data" para o mysql_data abaixo. Esses volumes
# do Coolify são estáveis entre deploys, mas trocar a aplicação de UUID (apagar
# e recriar no painel) deixa os dados para trás. Os volumes botcdp_* seguem no
# servidor com a cópia dos dados anterior à migração, como rollback.
volumes:
  mysql_data:
    name: botcdp_mysql_data
  redis_data:
    name: botcdp_redis_data
  public_data:
    name: botcdp_public_data
  wwebjs_auth:
    name: botcdp_wwebjs_auth
